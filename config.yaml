input: "C:/path/to/source.mp4"
output_dir: "./out"

clips:
  max_clips: 5
  min_len: 30
  max_len: 60

frame:
  width: 1080
  height: 1920
  crop_style: blur_bars
  blur_strength: 20

logo:
  path: "./assets/mw4_logo.png"
  corner: top_right
  scale: 0.18
  margin: 40

on_screen_text:
  text: "MW4 Open Beta This Weekend"
  font: "./assets/fonts/YourFont.ttf"
  font_size: 64
  color: "white"
  position: top
  margin: 120

analyze:
  detector: heuristic
  audio_weight: 0.6
  motion_weight: 0.4

encode:
  crf: 19
  preset: medium

vfx:
  enabled: true       # set false for a raw, effect-free render
  zoom: 0.08          # slow centred push-in (0.08 = up to 108%); 0 disables
  fade: 0.4           # fade in/out seconds at each clip's ends; 0 disables
  saturation: 1.18    # colour pop (1.0 = unchanged)
  contrast: 1.06      # 1.0 = unchanged
  vignette: true      # soft darkened edges
